name: Bug report
description: Something isn't working as described in the README.
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check you're on the [latest release](https://github.com/ferozsaha100/multi-location-map-widget/releases/latest) first.
        **Security issue?** Please report it privately; see [SECURITY.md](https://github.com/ferozsaha100/multi-location-map-widget/blob/main/SECURITY.md).

  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "2.4.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: WordPress / Elementor / PHP versions
      placeholder: "WordPress 6.6, Elementor 3.25, PHP 8.2"
    validations:
      required: true

  - type: dropdown
    id: widget
    attributes:
      label: Widget
      options:
        - Office Map
        - Multi-Location Map (original)
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Map engine
      options:
        - Leaflet + CARTO
        - Google Maps
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: layout
    attributes:
      label: Layout
      options:
        - "Layout 1: pins with hover popup"
        - "Layout 2: office list + pins"
        - Not applicable

  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an Office Map widget with …
        2. Click …
        3. See …
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Lines starting with `AVE Office Map:` are the most useful.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or page URL
      description: Optional. Please remove anything private.
