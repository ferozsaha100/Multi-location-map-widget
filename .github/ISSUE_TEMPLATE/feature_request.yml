name: Feature request
description: Suggest an improvement or a new option.
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or the site you're building, not just the feature.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like the widget to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
